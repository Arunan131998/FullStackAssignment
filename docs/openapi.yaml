openapi: 3.0.3
info:
  title: Lab Slot Booking API
  description: |
    REST API for the Lab Slot Booking System.
    - **Auth Service** handles registration, login, and user management.
    - **Booking Service** handles labs, slots, and bookings.
    - All protected endpoints require a `Bearer <token>` Authorization header.
  version: 1.0.0
  contact:
    name: Lab Slot Booking Assignment

servers:
  - url: http://localhost:4000
    description: Local API Gateway

tags:
  - name: Health
    description: Gateway health check
  - name: Auth
    description: Registration, login, current user
  - name: Users
    description: User management (admin)
  - name: Labs
    description: Lab CRUD
  - name: Slots
    description: Slot CRUD with availability metadata
  - name: Bookings
    description: Booking lifecycle

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Lab:
      type: object
      properties:
        _id:
          type: string
          example: "664a1234b5c6d7e8f9000001"
        name:
          type: string
          example: "Computer Networks Lab"
        location:
          type: string
          example: "Block A - Floor 2"
        totalSeats:
          type: integer
          example: 30
        equipmentTags:
          type: array
          items:
            type: string
          example: ["routers", "switches"]
        isActive:
          type: boolean
          example: true

    Slot:
      type: object
      properties:
        _id:
          type: string
          example: "664a1234b5c6d7e8f9000002"
        labId:
          $ref: '#/components/schemas/Lab'
        date:
          type: string
          format: date
          example: "2026-05-10"
        startTime:
          type: string
          example: "10:00"
        endTime:
          type: string
          example: "12:00"
        capacity:
          type: integer
          example: 10
        isActive:
          type: boolean
          example: true
        approvedCount:
          type: integer
          example: 3
        remainingCapacity:
          type: integer
          example: 7
        isAvailable:
          type: boolean
          example: true

    Booking:
      type: object
      properties:
        _id:
          type: string
          example: "664a1234b5c6d7e8f9000003"
        slotId:
          $ref: '#/components/schemas/Slot'
        studentId:
          type: string
          example: "664a1234b5c6d7e8f9000004"
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED]
          example: PENDING
        purpose:
          type: string
          example: "Assignment preparation"
        reviewedBy:
          type: string
          example: "664a1234b5c6d7e8f9000005"
        reviewedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    User:
      type: object
      properties:
        _id:
          type: string
          example: "664a1234b5c6d7e8f9000006"
        name:
          type: string
          example: "Alice"
        email:
          type: string
          example: "alice@example.com"
        role:
          type: string
          enum: [student, admin]
          example: student

    Error:
      type: object
      properties:
        message:
          type: string
          example: "Validation error"

paths:
  /health:
    get:
      tags: [Health]
      summary: Gateway health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  service:
                    type: string

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                  example: "Alice"
                email:
                  type: string
                  example: "alice@example.com"
                password:
                  type: string
                  minLength: 8
                  example: "Student@123"
                role:
                  type: string
                  enum: [student, admin]
                  example: student
      responses:
        '201':
          description: Registered and token returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
                  name:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "admin@example.com"
                password:
                  type: string
                  example: "Admin@123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
                  name:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /auth/users:
    get:
      tags: [Users]
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          description: Forbidden

  /auth/users/{id}:
    delete:
      tags: [Users]
      summary: Delete a user (admin or self)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '403':
          description: Cannot delete the last admin
        '404':
          description: User not found

  /booking/labs:
    get:
      tags: [Labs]
      summary: List all labs
      responses:
        '200':
          description: List of labs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lab'
    post:
      tags: [Labs]
      summary: Create a lab (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, location, totalSeats]
              properties:
                name:
                  type: string
                  example: "Computer Networks Lab"
                location:
                  type: string
                  example: "Block A - Floor 2"
                totalSeats:
                  type: integer
                  example: 30
                equipmentTags:
                  type: array
                  items:
                    type: string
                  example: ["routers"]
      responses:
        '201':
          description: Lab created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Lab'

  /booking/labs/{id}:
    patch:
      tags: [Labs]
      summary: Update a lab (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  type: string
                totalSeats:
                  type: integer
      responses:
        '200':
          description: Lab updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Lab'
        '409':
          description: Cannot reduce seats below existing slot capacity
    delete:
      tags: [Labs]
      summary: Delete a lab (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lab deleted
        '409':
          description: Cannot delete lab with active slots

  /booking/slots:
    get:
      tags: [Slots]
      summary: List all slots with availability metadata
      parameters:
        - name: labId
          in: query
          schema:
            type: string
          description: Filter by lab ID
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Filter by date
      responses:
        '200':
          description: List of slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Slot'
    post:
      tags: [Slots]
      summary: Create a slot (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labId, date, startTime, endTime, capacity]
              properties:
                labId:
                  type: string
                  example: "664a1234b5c6d7e8f9000001"
                date:
                  type: string
                  format: date
                  example: "2026-05-10"
                startTime:
                  type: string
                  example: "10:00"
                endTime:
                  type: string
                  example: "12:00"
                capacity:
                  type: integer
                  example: 10
      responses:
        '201':
          description: Slot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Slot'
        '400':
          description: Validation error (past date, invalid time range, capacity > lab seats)
        '409':
          description: Time conflict with existing slot

  /booking/slots/{id}:
    patch:
      tags: [Slots]
      summary: Update a slot (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                startTime:
                  type: string
                endTime:
                  type: string
                capacity:
                  type: integer
      responses:
        '200':
          description: Slot updated
        '400':
          description: Validation error
        '409':
          description: Conflict with approved bookings or time overlap
    delete:
      tags: [Slots]
      summary: Delete a slot (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Slot deleted
        '409':
          description: Cannot delete slot with active bookings

  /booking/bookings:
    get:
      tags: [Bookings]
      summary: List bookings (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, CANCELLED]
          description: Filter by status (omit for all)
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
    post:
      tags: [Bookings]
      summary: Create a booking (student)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId]
              properties:
                slotId:
                  type: string
                  example: "664a1234b5c6d7e8f9000002"
                purpose:
                  type: string
                  example: "Assignment preparation"
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Booking'
        '400':
          description: Slot full or already booked
        '409':
          description: Duplicate active booking for this slot

  /booking/bookings/me:
    get:
      tags: [Bookings]
      summary: Get own bookings (student)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student's bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'

  /booking/bookings/{id}/approve:
    patch:
      tags: [Bookings]
      summary: Approve a booking (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking approved
        '404':
          description: Booking not found

  /booking/bookings/{id}/reject:
    patch:
      tags: [Bookings]
      summary: Reject a booking (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking rejected
        '404':
          description: Booking not found

  /booking/bookings/{id}/cancel:
    patch:
      tags: [Bookings]
      summary: Cancel a booking (student or admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking cancelled
        '403':
          description: Not authorized to cancel this booking
        '404':
          description: Booking not found
